name: Fix payments period loading once
on:
  push:
    paths:
      - '.github/workflows/fix-payments-period-once.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch payments page
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/payments/page.tsx')
          text = p.read_text()
          anchor = '  const { toast } = useToast()'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '''  const [hasLoadedInitially, setHasLoadedInitially] = useState(false)
          useEffect(() => {
            if (!isLoading) setHasLoadedInitially(true)
          }, [isLoading])
          ''' + anchor, 1)
          original = '  if (isLoading) {\n    return <LoadingStudents message="Carregando pagamentos..." />\n  }'
          assert text.count(original) == 1
          text = text.replace(original, '  if (isLoading && !hasLoadedInitially) {\n    return <LoadingStudents message="Carregando pagamentos..." />\n  }', 1)
          root = '    <div className="min-h-screen bg-background flex flex-col">\n      <AppHeader />'
          assert text.count(root) == 1
          overlay = '''    <div className="min-h-screen bg-background flex flex-col">
                {isLoading && hasLoadedInitially && (
                  <div className="fixed inset-0 z-[9999] flex items-center justify-center px-4" role="status" aria-live="polite" aria-busy="true">
                    <div className="absolute inset-0 bg-slate-950/25 backdrop-blur-md" />
                    <div className="relative flex w-full max-w-md items-center gap-4 rounded-2xl border border-border bg-card p-5 shadow-2xl">
                      <span className="h-6 w-6 shrink-0 animate-spin rounded-full border-[3px] border-primary/20 border-t-primary" aria-hidden="true" />
                      <div>
                        <p className="font-semibold text-foreground">Atualizando período</p>
                        <p className="text-sm text-muted-foreground">Carregando os pagamentos do período selecionado...</p>
                      </div>
                    </div>
                  </div>
                )}
                <AppHeader />'''
          text = text.replace(root, overlay, 1)
          p.write_text(text)
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/payments/page.tsx
          git commit -m "Keep payments visible with blurred period loading overlay"
          git push