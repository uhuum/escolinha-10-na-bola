name: SIGA Push Scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  trigger-push:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SIGA push function
        run: |
          curl --fail --show-error --silent \
            --retry 3 \
            --retry-delay 5 \
            --max-time 30 \
            https://plataformasiga.netlify.app/.netlify/functions/push-notifications
